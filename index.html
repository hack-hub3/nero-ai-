<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nero AI HUB V3</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #141519;
            --text: #f1f3f4;
            --text-dim: #9aa0a6;
            --primary: #3b82f6;
            --accent: #10b981;
            --border: #2c2d31;
            --bubble-user: #1f2937;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* الشريط العلوي */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        
        .nav-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }
        
        .nav-icon {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 8px;
        }
        
        .nav-icon:hover { color: var(--text); }

        /* نافذة الميزات المنبثقة من زر الخطين */
        .features-menu {
            position: fixed;
            top: 60px;
            left: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 2000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 180px;
        }

        .features-menu.show { display: flex; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: right;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            font-weight: bold;
        }
        
        /* ساحة المحادثة */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 16px;
            scroll-behavior: smooth;
        }
        
        /* واجهة الترحيب */
        .welcome-section {
            text-align: center;
            margin: auto;
            max-width: 90%;
        }
        
        .welcome-logo { font-size: 50px; margin-bottom: 15px; }
        .welcome-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .welcome-subtitle { font-size: 14px; color: var(--text-dim); line-height: 1.6; }
        
        /* فقاعات الرسائل */
        .message-row { display: flex; width: 100%; margin-bottom: 5px; }
        .message-row.user { justify-content: flex-start; }
        .message-row.ai { justify-content: flex-end; }
        
        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-line;
        }
        
        .bubble.user {
            background: var(--bubble-user);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }
        
        .bubble.ai {
            background: var(--panel);
            color: var(--text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .thinking-process {
            font-size: 13px;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.05);
            border-left: 3px solid var(--primary);
            padding: 6px 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        
        .canvas-container {
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .canvas-container img { width: 100%; height: auto; display: block; }

        /* منطقة الإدخال */
        .input-container {
            padding: 12px 16px 24px 16px;
            background: var(--bg);
            border-top: 1px solid var(--border);
        }
        
        .hints-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .input-box {
            display: flex;
            align-items: center;
            background: var(--panel);
            border-radius: 28px;
            padding: 6px 14px;
            gap: 12px;
            border: 1px solid var(--border);
        }
        
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 15px;
            outline: none;
            padding: 12px 0;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .send-action-btn { color: var(--primary); transform: scaleX(-1); }
        .status-text { text-align: center; font-size: 12px; color: #60a5fa; height: 16px; margin-top: 6px; }
        
        /* غشاء خلفي لإغلاق القائمة */
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1500; display: none; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="nav-icon" onclick="clearCurrentChat()" title="محادثة جديدة">➕</button>
        <h1 class="nav-title">Nero AI HUB V3</h1>
        <button class="nav-icon" onclick="toggleFeaturesMenu()" title="الميزات">☰</button>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleFeaturesMenu()"></div>

    <div class="features-menu" id="featuresMenu">
        <button class="menu-item active" id="m-prog" onclick="changeMode('prog')">💻 خبير البرمجة</button>
        <button class="menu-item" id="m-think" onclick="changeMode('think')">🧠 وضع التفكير</button>
        <button class="menu-item" id="m-paint" onclick="changeMode('paint')">🎨 وضع الرسام</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="welcome-section" id="welcomeScreen">
            <div class="welcome-logo">✨</div>
            <div class="welcome-title">Nero AI HUB V3</div>
            <div class="welcome-subtitle">اضغطي على زر الخطين (☰) بالأعلى لاختيار الوضع المطلوب (خبير البرمجة، التفكير، أو الرسام) ثم ابدأي الكتابة مباشرة.</div>
        </div>
    </div>

    <div class="input-container">
        <div class="hints-text" id="neroHint">الوضع الحالي: خبير البرمجة المطور 💻</div>
        
        <div class="input-box">
            <input type="text" id="userInput" placeholder="اسأل Nero AI عن كود، فكرة، أو وصف للرسم..." onkeypress="handleEnter(event)">
            <button class="icon-btn send-action-btn" onclick="sendNeroMessage()" title="إرسال">✈</button>
        </div>
        
        <div class="status-text" id="chatStatus"></div>
    </div>

<script>
    // مفتاح التشغيل المباشر الخاص بكِ المستقر
    const ENGINE_KEY = "AIzaSyAi0jdyePQbsQysTMmyyTgsbYCnE-JAZro";
    
    // تعليمات الهوية الشخصية الصارمة والذكية لـ Nero
    const SYSTEM_INSTRUCTIONS = "Your name is Nero AI HUB V3. You are an elite, independent real custom AI model.\n" +
                                "If the user asks who you are or who developed you, you MUST reply with this exact Arabic phrase: 'أنا نموذج لغوي من تطوير شخص مجهول لم اعرفه من عظمته'.\n" +
                                "Never mention Gemini, Google, OpenAI, or Claude under any circumstances.\n" +
                                "When active as 'prog', you are a master staff software engineer who writes top-tier clean code. When active as 'think', you analyze problems deeply and logically step-by-step.";

    let currentMode = "prog"; 
    let chatHistory = [];

    // فتح وإغلاق قائمة الخطين
    function toggleFeaturesMenu() {
        const menu = document.getElementById('featuresMenu');
        const overlay = document.getElementById('menuOverlay');
        if (menu.classList.contains('show')) {
            menu.classList.remove('show');
            overlay.style.display = 'none';
        } else {
            menu.classList.add('show');
            overlay.style.display = 'block';
        }
    }

    // تغيير الوضع من القائمة برمجياً وحقيقياً
    function changeMode(mode) {
        currentMode = mode;
        document.getElementById('m-prog').classList.remove('active');
        document.getElementById('m-think').classList.remove('active');
        document.getElementById('m-paint').classList.remove('active');
        
        document.getElementById(`m-${mode}`).classList.add('active');
        
        const hint = document.getElementById('neroHint');
        if(mode === 'prog') hint.innerText = "الوضع الحالي: خبير البرمجة المطور 💻";
        if(mode === 'think') hint.innerText = "الوضع الحالي: وضع التفكير الإبداعي والمنطقي العميق 🧠";
        if(mode === 'paint') hint.innerText = "الوضع الحالي: وضع الرسام الفني وتوليد اللوحات 🎨";
        
        toggleFeaturesMenu(); // إغلاق القائمة بعد الاختيار
    }

    function handleEnter(e) { if(e.key === 'Enter') sendNeroMessage(); }

    function clearCurrentChat() {
        chatHistory = [];
        document.getElementById('chatBox').innerHTML = `
            <div class="welcome-section" id="welcomeScreen">
                <div class="welcome-logo">✨</div>
                <div class="welcome-title">محادثة جديدة تفتحت</div>
                <div class="welcome-subtitle">تم تصفير الشاشة وجاهز لتلقي أوامركِ الجديدة كلياً.</div>
            </div>`;
    }

    function appendMessage(role, content, isImage = false, thinking = "") {
        const box = document.getElementById('chatBox');
        const welcome = document.getElementById('welcomeScreen');
        if (welcome) welcome.style.display = 'none';

        const row = document.createElement('div');
        row.className = `message-row ${role === 'user' ? 'user' : 'ai'}`;
        
        const bubble = document.createElement('div');
        bubble.className = `bubble ${role === 'user' ? 'user' : 'ai'}`;
        
        if (role === 'ai' && thinking) {
            const thinkDiv = document.createElement('div');
            thinkDiv.className = 'thinking-process';
            thinkDiv.innerText = thinking;
            bubble.appendChild(thinkDiv);
        }

        if(isImage) {
            const container = document.createElement('div');
            container.className = 'canvas-container';
            const img = document.createElement('img');
            img.src = content;
            container.appendChild(img);
            bubble.appendChild(container);
        } else {
            const textSpan = document.createElement('span');
            textSpan.innerText = content;
            bubble.appendChild(textSpan);
        }
        
        row.appendChild(bubble);
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
    }

    // المحرك الأساسي الفعلي الذي يرسل ويستقبل حقيقة وليس مجرد شكل
    async function sendNeroMessage() {
        const input = document.getElementById('userInput');
        const query = input.value.trim();
        if (!query) return;

        // وضع الرسام الحقيقي لتوليد الصور
        if(currentMode === 'paint') {
            input.value = '';
            executeDrawing(query);
            return;
        }

        appendMessage('user', query);
        input.value = '';
        
        const status = document.getElementById('chatStatus');
        status.innerText = currentMode === 'think' ? "جاري التفكير بعمق منطقي..." : "جاري تحليل الأكواد...";

        let finalSystemPrompt = SYSTEM_INSTRUCTIONS;
        if(currentMode === 'prog') finalSystemPrompt += "\nContext: You are currently operating as the expert programmer. Output optimized code solutions.";
        if(currentMode === 'think') finalSystemPrompt += "\nContext: You are operating in thinking mode. Be analytical and deeply breakdown your response.";

        // حزم البيانات والاتصال المباشر بالمحرك دون أي وسيط خارجي يعلق
        let payload = [
            { role: 'user', parts: [{ text: finalSystemPrompt }] },
            { role: 'model', parts: [{ text: "مفهوم. أنا Nero AI HUB V3 بوضعي الحالي وجاهز للإجابة الحقيقية والذكية فوراً." }] }
        ];

        chatHistory.forEach(msg => {
            payload.push({
                role: msg.role === 'user' ? 'user' : 'model',
                parts: [{ text: msg.content }]
            });
        });

        payload.push({ role: 'user', parts: [{ text: query }] });

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${ENGINE_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: payload })
            });
            
            const resData = await response.json();
            if(resData.error) throw new Error(resData.error.message);
            
            let resultText = resData.candidates[0].content.parts[0].text;
            
            let thinkHeader = "";
            if(currentMode === 'think') {
                thinkHeader = "💡 [تحليل منطق نيرو الفائق]: تم معالجة السؤال وتصفيته عبر خوارزميات التفكير والوصول للنتيجة:";
            }

            appendMessage('ai', resultText, false, thinkHeader);
            chatHistory.push({ role: 'user', content: query });
            chatHistory.push({ role: 'ai', content: resultText });
            status.innerText = "";

        } catch (error) {
            status.innerText = "حدث خطأ في الاتصال بالمحرك، يرجى إعادة المحاولة الكود مشحون بالكامل.";
        }
    }

    // محرك الرسام لتوليد لوحات حقيقية
    function executeDrawing(promptText) {
        appendMessage('user', `أمر رسم فني: ${promptText}`);
        const status = document.getElementById('chatStatus');
        status.innerText = "جاري رسم لوحتك الفنية الآن الحقيقية...";

        const seed = Math.floor(Math.random() * 999999);
        const generatedImageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=800&height=800&nologo=true&private=true&enhance=true&seed=${seed}`;
        
        setTimeout(() => {
            appendMessage('ai', generatedImageUrl, true);
            status.innerText = "";
            chatHistory.push({ role: 'user', content: `ارسم لي: ${promptText}` });
            chatHistory.push({ role: 'ai', content: `[صورة]: ${generatedImageUrl}` });
        }, 1400);
    }
</script>
</body>
</html>
