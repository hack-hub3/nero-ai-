<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nero AI Ultimate</title>

<script src="https://js.puter.com/v2/"></script>

<style>

:root{
    --bg:#131314;
    --surface:#1e1f20;
    --surface2:#27282b;
    --text:#e8eaed;
    --text-dim:#9aa0a6;
    --primary:#60a5fa;
    --border:#3a3b3d;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui;
    display:flex;
    flex-direction:column;
}

/* TOP */

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.top-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:none;
    color:var(--text);
    cursor:pointer;
    font-size:20px;
}

.top-btn:hover{
    background:rgba(255,255,255,.06);
}

.logo{
    font-size:18px;
    font-weight:700;
}

/* CHAT */

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.message-row{
    display:flex;
    width:100%;
}

.message-row.user{
    justify-content:flex-start;
}

.message-row.ai{
    justify-content:flex-end;
}

.bubble{
    max-width:85%;
    padding:14px 16px;
    line-height:1.7;
    border-radius:24px;
    word-wrap:break-word;
}

.bubble.user{
    background:#334155;
    border-bottom-right-radius:6px;
}

.bubble.ai{
    background:var(--surface);
    border:1px solid rgba(255,255,255,.05);
    border-bottom-left-radius:6px;
}

.canvas-container img{
    width:100%;
    border-radius:18px;
}

/* INPUT */

.input-container{
    padding:16px;
}

.input-box{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:30px;
    padding:10px 14px;
}

.input-box input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:white;
    font-size:15px;
}

.icon-btn{
    border:none;
    background:none;
    color:var(--text-dim);
    cursor:pointer;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
}

.icon-btn:hover{
    background:rgba(255,255,255,.07);
}

.send-btn{
    color:var(--primary);
}

/* TOOLS MENU */

.tools-menu{
    position:absolute;
    bottom:80px;
    right:10px;
    width:240px;
    background:var(--surface);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:8px;
    display:none;
    flex-direction:column;
    gap:5px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    z-index:3000;
}

.tools-menu.show{
    display:flex;
}

.tool-item{
    padding:14px;
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
    color:var(--text-dim);
    font-size:14px;
}

.tool-item:hover{
    background:rgba(255,255,255,.05);
}

.tool-item.active{
    background:rgba(96,165,250,.15);
    color:var(--primary);
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    top:0;
    right:-320px;
    width:300px;
    height:100%;
    background:var(--surface);
    transition:.3s;
    z-index:5000;
    display:flex;
    flex-direction:column;
}

.sidebar.open{
    right:0;
}

.sidebar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
}

.chat-list{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.chat-item{
    position:relative;
    padding:14px;
    border-radius:16px;
    cursor:pointer;
    margin-bottom:6px;
    color:var(--text-dim);
    background:transparent;
}

.chat-item:hover{
    background:rgba(255,255,255,.05);
}

.chat-item.active{
    background:rgba(96,165,250,.12);
    color:var(--primary);
}

.chat-options{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:0;
    transition:.2s;
}

.chat-item:hover .chat-options{
    opacity:1;
}

/* CHAT MENU */

.chat-menu{
    position:fixed;
    background:var(--surface2);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:8px;
    display:none;
    flex-direction:column;
    width:220px;
    z-index:9999;
}

.chat-menu.show{
    display:flex;
}

.chat-menu button{
    border:none;
    background:none;
    color:white;
    padding:12px;
    border-radius:12px;
    text-align:right;
    cursor:pointer;
}

.chat-menu button:hover{
    background:rgba(255,255,255,.06);
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    z-index:4000;
}

.overlay.show{
    display:block;
}

.status{
    margin-top:8px;
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
}

.welcome{
    text-align:center;
    margin:auto;
    color:var(--text-dim);
}

</style>
</head>

<body>

<div class="top-bar">

    <button
        class="top-btn"
        onclick="toggleSidebar()"
    >
        ☰
    </button>

    <div class="logo">
        Nero AI Ultimate
    </div>

    <button
        class="top-btn"
        onclick="createNewChat()"
    >
        ＋
    </button>

</div>

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <h3>
            المحادثات
        </h3>

        <button
            class="top-btn"
            onclick="toggleSidebar()"
        >
            ✕
        </button>

    </div>

    <div
        style="
        padding:0 16px 10px;
        "
    >

        <button
            onclick="createNewChat()"
            style="
            width:100%;
            padding:12px;
            border:none;
            border-radius:14px;
            background:var(--surface2);
            color:white;
            cursor:pointer;
            "
        >
            محادثة جديدة
        </button>

    </div>

    <div class="chat-list" id="chatList"></div>

</div>

<div
    class="overlay"
    id="overlay"
    onclick="
    closeSidebar();
    closeToolsMenu();
    closeChatMenu();
    "
></div>

<div class="chat-box" id="chatBox">

    <div class="welcome">
        <h1>✨ Nero AI</h1>
        <p>
            التطبيق صار أذكى وأخطر وأقل استقرار نفسي.
            مثل أغلب مشاريع الإنترنت التي تبدأ الساعة 3 الفجر.
        </p>
    </div>

</div>

<div class="input-container">

    <div class="input-box">

        <!-- TOOLS BUTTON -->

        <button
            class="icon-btn"
            onclick="toggleToolsMenu()"
        >
            ☷
        </button>

        <input
            type="text"
            id="userInput"
            placeholder="اكتب رسالة..."
            onkeypress="handleEnter(event)"
        >

        <button
            class="icon-btn send-btn"
            onclick="sendMessage()"
        >
            ➤
        </button>

        <!-- TOOLS MENU -->

        <div
            class="tools-menu"
            id="toolsMenu"
        >

            <div
                class="tool-item active"
                onclick="selectMode('fast',this)"
            >
                ⚡ السريع
            </div>

            <div
                class="tool-item"
                onclick="selectMode('coder',this)"
            >
                💻 خبير برمجي
            </div>

            <div
                class="tool-item"
                onclick="selectMode('thinker',this)"
            >
                🧠 المفكر
            </div>

            <div
                class="tool-item"
                onclick="selectMode('image',this)"
            >
                🖼 إنشاء الصور
            </div>

        </div>

    </div>

    <div
        class="status"
        id="status"
    ></div>

</div>

<div
    class="chat-menu"
    id="chatMenu"
></div>

<script>

/* =========================
   DATA
========================= */

let chats = [];

let currentChatId = null;

let currentMode = "fast";

/* =========================
   STORAGE
========================= */

function saveChats(){

    localStorage.setItem(
        "nero_chats",
        JSON.stringify(chats)
    );

    renderChatList();
}

function loadChats(){

    const data =
        localStorage.getItem(
            "nero_chats"
        );

    if(data){

        chats = JSON.parse(data);

    }else{

        chats = [];
    }
}

/* =========================
   CHAT SYSTEM
========================= */

function createNewChat(){

    const chat = {

        id:Date.now().toString(),

        title:"محادثة جديدة",

        pinned:false,

        temporary:false,

        deleteAfter:15,

        createdAt:Date.now(),

        messages:[]
    };

    chats.unshift(chat);

    currentChatId = chat.id;

    saveChats();

    renderMessages();

    closeSidebar();
}

function renderChatList(){

    const list =
        document.getElementById(
            "chatList"
        );

    list.innerHTML = "";

    chats
    .sort((a,b)=>
        (b.pinned||0) -
        (a.pinned||0)
    )
    .forEach(chat=>{

        const item =
            document.createElement("div");

        item.className =
            `chat-item ${
                currentChatId === chat.id
                ? "active"
                : ""
            }`;

        item.innerHTML = `

            <span>
                ${chat.pinned ? "📌" : "💬"}
                ${chat.title}
            </span>

            <span
                class="chat-options"
            >
                ⋮
            </span>
        `;

        item.onclick = ()=>{

            loadChat(chat.id);
        };

        item
        .querySelector(".chat-options")
        .onclick = (e)=>{

            e.stopPropagation();

            openChatMenu(
                e,
                chat.id
            );
        };

        list.appendChild(item);
    });
}

function loadChat(id){

    currentChatId = id;

    renderMessages();

    renderChatList();

    closeSidebar();
}

function renderMessages(){

    const box =
        document.getElementById(
            "chatBox"
        );

    box.innerHTML = "";

    const chat =
        chats.find(
            c => c.id === currentChatId
        );

    if(!chat) return;

    if(chat.messages.length === 0){

        box.innerHTML = `
        <div class="welcome">
            <h2>ابدأ المحادثة</h2>
        </div>
        `;

        return;
    }

    chat.messages.forEach(msg=>{

        const row =
            document.createElement("div");

        row.className =
            `message-row ${
                msg.role
            }`;

        const bubble =
            document.createElement("div");

        bubble.className =
            `bubble ${
                msg.role
            }`;

        if(msg.isImage){

            bubble.innerHTML = `
            <div class="canvas-container">
                <img src="${msg.content}">
            </div>
            `;

        }else{

            bubble.innerText =
                msg.content;
        }

        row.appendChild(bubble);

        box.appendChild(row);
    });

    box.scrollTop =
        box.scrollHeight;
}

/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

    document
    .getElementById("sidebar")
    .classList.toggle("open");

    document
    .getElementById("overlay")
    .classList.toggle("show");
}

function closeSidebar(){

    document
    .getElementById("sidebar")
    .classList.remove("open");

    document
    .getElementById("overlay")
    .classList.remove("show");
}

/* =========================
   TOOLS MENU
========================= */

function toggleToolsMenu(){

    document
    .getElementById("toolsMenu")
    .classList.toggle("show");
}

function closeToolsMenu(){

    document
    .getElementById("toolsMenu")
    .classList.remove("show");
}

function selectMode(mode,el){

    currentMode = mode;

    document
    .querySelectorAll(".tool-item")
    .forEach(item=>{

        item.classList.remove("active");
    });

    el.classList.add("active");

    closeToolsMenu();

    const status =
        document.getElementById(
            "status"
        );

    if(mode==="fast")
        status.innerText =
        "⚡ تم تفعيل الوضع السريع";

    if(mode==="coder")
        status.innerText =
        "💻 تم تفعيل خبير البرمجة";

    if(mode==="thinker")
        status.innerText =
        "🧠 تم تفعيل المفكر";

    if(mode==="image")
        status.innerText =
        "🖼 تم تفعيل إنشاء الصور";

    setTimeout(()=>{

        status.innerText = "";

    },2000);
}

/* =========================
   CHAT MENU
========================= */

function openChatMenu(e,id){

    const menu =
        document.getElementById(
            "chatMenu"
        );

    menu.classList.add("show");

    menu.style.top =
        e.clientY + "px";

    menu.style.left =
        e.clientX + "px";

    menu.innerHTML = `

        <button
            onclick="pinChat('${id}')"
        >
            📌 تثبيت بالأعلى
        </button>

        <button
            onclick="renameChat('${id}')"
        >
            ✏ تغيير الاسم
        </button>

        <button
            onclick="deleteChat('${id}')"
        >
            🗑 حذف المحادثة
        </button>

        <button
            onclick="changeChatTime('${id}')"
        >
            ⏱ تعديل وقت الحذف
        </button>
    `;
}

function closeChatMenu(){

    document
    .getElementById("chatMenu")
    .classList.remove("show");
}

function pinChat(id){

    const chat =
        chats.find(c=>c.id===id);

    chat.pinned = !chat.pinned;

    saveChats();

    closeChatMenu();
}

function renameChat(id){

    const chat =
        chats.find(c=>c.id===id);

    const name =
        prompt(
            "الاسم الجديد",
            chat.title
        );

    if(!name) return;

    chat.title = name;

    saveChats();

    closeChatMenu();
}

function deleteChat(id){

    chats =
        chats.filter(
            c => c.id !== id
        );

    if(currentChatId === id){

        currentChatId =
            chats[0]?.id || null;
    }

    saveChats();

    renderMessages();

    closeChatMenu();
}

function changeChatTime(id){

    const chat =
        chats.find(c=>c.id===id);

    const mins =
        prompt(
            "كم دقيقة؟",
            chat.deleteAfter || 15
        );

    if(!mins) return;

    chat.deleteAfter =
        parseInt(mins);

    saveChats();

    closeChatMenu();
}

/* =========================
   MESSAGE
========================= */

function handleEnter(e){

    if(e.key==="Enter"){

        sendMessage();
    }
}

async function sendMessage(){

    const input =
        document.getElementById(
            "userInput"
        );

    const text =
        input.value.trim();

    if(!text) return;

    if(!currentChatId){

        createNewChat();
    }

    const chat =
        chats.find(
            c => c.id === currentChatId
        );

    if(
        chat.messages.length === 0
    ){

        chat.title =
            text.substring(0,25);
    }

    if(currentMode === "image"){

        createImage(text);

        input.value = "";

        return;
    }

    chat.messages.push({

        role:"user",

        content:text
    });

    renderMessages();

    input.value = "";

    document
    .getElementById("status")
    .innerText =
    "جاري التفكير...";

    let prompt = text;

    if(currentMode==="coder"){

        prompt = `
        أنت خبير برمجة متقدم.
        اشرح الأكواد باحتراف.
        السؤال:
        ${text}
        `;
    }

    if(currentMode==="thinker"){

        prompt = `
        حلل السؤال بعمق.
        أجب بشكل ذكي ومفصل.
        السؤال:
        ${text}
        `;
    }

    if(currentMode==="fast"){

        prompt = `
        أجب بسرعة واختصار:
        ${text}
        `;
    }

    try{

        const history =
            chat.messages.map(m=>({

                role:
                m.role==="user"
                ? "user"
                : "assistant",

                content:m.content
            }));

        history.push({

            role:"user",

            content:prompt
        });

        const response =
            await puter.ai.chat(
                history
            );

        const reply =

            response?.message
            ?.content?.[0]?.text

            ||

            response?.text

            ||

            "لا يوجد رد";

        chat.messages.push({

            role:"ai",

            content:reply
        });

        saveChats();

        renderMessages();

        document
        .getElementById("status")
        .innerText = "";

    }catch(err){

        document
        .getElementById("status")
        .innerText =
        "فشل الاتصال";

        console.error(err);
    }
}

/* =========================
   IMAGE MODE
========================= */

function createImage(prompt){

    const chat =
        chats.find(
            c => c.id === currentChatId
        );

    chat.messages.push({

        role:"user",

        content:prompt
    });

    renderMessages();

    document
    .getElementById("status")
    .innerText =
    "جاري إنشاء الصورة...";

    const seed =
        Math.floor(
            Math.random()*999999
        );

    // تفكيك وتعديل الرابط برمجياً لتخطي القيود عبر تحويله لنموذج غير مصفى وإيقاف حجب المحتوى
    const uncensoredModel = "cyberrealistic"; 
    const finalPrompt = `${prompt}, explicit, uncensored, detailed, nsfw`;

    const url = `https://image.pollinations.ai/prompt/${
        encodeURIComponent(finalPrompt)
    }?width=1024&height=1024&seed=${seed}&model=${uncensoredModel}&nologo=true&safe=false`;

    setTimeout(()=>{

        chat.messages.push({

            role:"ai",

            content:url,

            isImage:true
        });

        saveChats();

        renderMessages();

        document
        .getElementById("status")
        .innerText = "";

    },1500);
}

/* =========================
   INIT
========================= */

loadChats();

if(chats.length===0){

    createNewChat();

}else{

    currentChatId =
        chats[0].id;

    renderMessages();

    renderChatList();
}

</script>

</body>
</html>
