<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الدردشة المشفرة والآمنة</title>
    
    <!-- مكتبات Firebase Compat CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- مكتبة CryptoJS للتشفير والحماية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #7c4dff;
            --primary-hover: #651fff;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
            --my-message: #3a3a3c;
            --other-message: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--surface-color);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        /* شاشة الدخول */
        #auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            height: 100%;
            gap: 15px;
        }

        .auth-card {
            background: var(--bg-color);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        input, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--surface-color);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: var(--text-color);
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* شاشة الدردشة */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        /* شريط الرسالة المثبتة */
        #pinned-bar {
            background-color: var(--primary-color);
            padding: 10px 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        #pinned-bar span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 80%;
        }

        /* منطقة الرسائل */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            width: fit-content;
        }

        .message-row.me {
            align-self: flex-start;
        }

        .message-row.others {
            align-self: flex-end;
        }

        .sender-name {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            padding-right: 8px;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-break: break-word;
        }

        .me .message-bubble {
            background-color: var(--primary-color);
            border-top-right-radius: 4px;
        }

        .others .message-bubble {
            background-color: var(--other-message);
            border-top-left-radius: 4px;
        }

        .message-img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        /* أدوات التفاعل داخل الرسالة */
        .message-tools {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .tool-btn {
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 2px 5px;
        }

        .tool-btn:hover {
            color: var(--text-color);
        }

        .reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .reaction-badge {
            background: var(--bg-color);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 12px;
        }

        /* صندوق الإدخال */
        #input-area {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            background-color: var(--bg-color);
        }

        #message-input {
            flex: 1;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 5px;
        }

        .icon-btn:hover {
            color: var(--text-color);
        }

        #image-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة الدخول -->
        <div id="auth-screen">
            <div class="auth-card">
                <h2>🔒 انضم للدردشة المشفرة</h2>
                <input type="text" id="nickname" placeholder="الاسم المستعار">
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="password" placeholder="كلمة المرور الشخصية">
                <input type="password" id="room-pass" placeholder="كلمة مرور الغرفة (مفتاح التشفير)">
                <button id="login-btn">دخول / تسجيل جديد</button>
            </div>
        </div>

        <!-- شاشة الدردشة -->
        <div id="chat-screen">
            <!-- شريط الرسالة المثبتة -->
            <div id="pinned-bar">
                <span id="pinned-text">لا توجد رسائل مثبتة حالياً</span>
                <button class="tool-btn" id="unpin-btn" style="color: white;">إلغاء التثبيت</button>
            </div>

            <!-- منطقة الرسائل -->
            <div id="messages-container"></div>

            <!-- صندوق الإدخال -->
            <div id="input-area">
                <button class="icon-btn" id="emoji-trigger" onclick="addEmoji('😊')">😊</button>
                <button class="icon-btn" onclick="document.getElementById('image-input').click()">📷</button>
                <input type="file" id="image-input" accept="image/*">
                <input type="text" id="message-input" placeholder="اكتب رسالتك المشفّرة...">
                <button id="send-btn">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        // 1. كائن التهيئة الخاص بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyBOsTatQEyXRgEWY_UDsheJWPV1uuaSBzY",
            authDomain: "nochat-d3880.firebaseapp.com",
            databaseURL: "https://nochat-d3880-default-rtdb.firebaseio.com",
            projectId: "nochat-d3880",
            storageBucket: "nochat-d3880.firebasestorage.app",
            messagingSenderId: "108461194977",
            appId: "1:108461194977:web:e0342c98900b53341f81a0",
            measurementId: "G-B2PMMBTKD1"
        };

        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.database();

        // تجزئة SHA-256 لكلمة المرور الحقيقية "SecretRoom123" لحمايتها من العرض المباشر في GitHub
        const ROOM_PASS_HASH = "81c3c0f209e75c87239ef4c66d11f971c26b9a21238612f009e53ed42e617d91";

        let currentUser = null;
        let encryptionKey = ""; // تُستخدم لتشفير وفك تشفير البياناتEnd-to-End
        let starredMessages = JSON.parse(localStorage.getItem('starred_messages')) || [];

        // عناصر الواجهة
        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const roomPassInput = document.getElementById('room-pass');
        const loginBtn = document.getElementById('login-btn');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const imageInput = document.getElementById('image-input');
        const pinnedBar = document.getElementById('pinned-bar');
        const pinnedText = document.getElementById('pinned-text');
        const unpinBtn = document.getElementById('unpin-btn');

        // أدوات التشفير
        function encryptText(text, secretKey) {
            if (!text) return null;
            return CryptoJS.AES.encrypt(text, secretKey).toString();
        }

        function decryptText(ciphertext, secretKey) {
            if (!ciphertext) return "";
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, secretKey);
                const originalText = bytes.toString(CryptoJS.enc.Utf8);
                return originalText || "[تعذر فك التشفير - مفتاح غير صالح]";
            } catch (e) {
                return "[رسالة مشفرة غير صالحة]";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('chat_email');
            const savedNick = localStorage.getItem('chat_nickname');
            if (savedEmail && savedNick) {
                emailInput.value = savedEmail;
                nicknameInput.value = savedNick;
            }
        });

        // تسجيل الدخول والتحقق
        loginBtn.addEventListener('click', async () => {
            const nickname = nicknameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const roomPass = roomPassInput.value;

            if (!nickname || !email || !password || !roomPass) {
                alert("يرجى ملء جميع الحقول المطلوبة.");
                return;
            }

            // التحقق المترجم بـ SHA-256
            const inputHash = CryptoJS.SHA256(roomPass).toString();
            if (inputHash !== ROOM_PASS_HASH) {
                alert("كلمة مرور الغرفة غير صحيحة!");
                return;
            }

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    try {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } catch (createError) {
                        alert("خطأ في إنشاء الحساب: " + createError.message);
                        return;
                    }
                } else {
                    alert("خطأ في تسجيل الدخول: " + error.message);
                    return;
                }
            }

            encryptionKey = roomPass; // اعتماد كلمة سر الغرفة كمفتاح تشفير
            localStorage.setItem('chat_email', email);
            localStorage.setItem('chat_nickname', nickname);
            
            currentUser = {
                uid: auth.currentUser.uid,
                nickname: nickname
            };

            showChatScreen();
        });

        function showChatScreen() {
            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            listenForMessages();
            listenForPinnedMessage();
        }

        sendBtn.addEventListener('click', sendTextMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        function sendTextMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            saveMessageToFirebase(text, null);
            messageInput.value = '';
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                saveMessageToFirebase("[صورة]", event.target.result);
            };
            reader.readAsDataURL(file);
            imageInput.value = '';
        });

        function saveMessageToFirebase(text, base64Image) {
            // تشفير النص والصورة قبل إرسالهما لسيرفر Firebase
            const encryptedText = encryptText(text, encryptionKey);
            const encryptedImage = base64Image ? encryptText(base64Image, encryptionKey) : null;

            const msgRef = db.ref('messages').push();
            msgRef.set({
                id: msgRef.key,
                senderId: currentUser.uid,
                senderName: currentUser.nickname,
                text: encryptedText,
                image: encryptedImage,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        function listenForMessages() {
            db.ref('messages').limitToLast(50).on('value', (snapshot) => {
                messagesContainer.innerHTML = '';
                snapshot.forEach((childSnapshot) => {
                    const msg = childSnapshot.val();
                    renderMessage(msg);
                });
                scrollToBottom();
            });
        }

        function renderMessage(msg) {
            // فك تشفير الرسالة والصورة للعرض المحلّي فقط
            const decryptedText = decryptText(msg.text, encryptionKey);
            const decryptedImage = msg.image ? decryptText(msg.image, encryptionKey) : null;

            const isMe = msg.senderId === currentUser.uid;
            const messageRow = document.createElement('div');
            messageRow.className = `message-row ${isMe ? 'me' : 'others'}`;
            messageRow.id = `msg-${msg.id}`;

            const sender = document.createElement('div');
            sender.className = 'sender-name';
            sender.innerText = isMe ? 'أنت' : msg.senderName;
            messageRow.appendChild(sender);

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            if (decryptedText) {
                const textNode = document.createElement('span');
                textNode.innerText = decryptedText;
                bubble.appendChild(textNode);
            }

            if (decryptedImage && decryptedImage.startsWith('data:image')) {
                const img = document.createElement('img');
                img.src = decryptedImage;
                img.className = 'message-img';
                bubble.appendChild(img);
            }

            const tools = document.createElement('div');
            tools.className = 'message-tools';

            const pinBtn = document.createElement('button');
            pinBtn.className = 'tool-btn';
            pinBtn.innerText = '📌 تثبيت';
            pinBtn.onclick = () => pinMessage(decryptedText || "[صورة]", msg.senderName);
            tools.appendChild(pinBtn);

            const isStarred = starredMessages.includes(msg.id);
            const starBtn = document.createElement('button');
            starBtn.className = 'tool-btn';
            starBtn.innerText = isStarred ? '⭐ مُميزة' : '☆ تمييز';
            starBtn.onclick = () => toggleStar(msg.id, starBtn);
            tools.appendChild(starBtn);

            const reactBtn = document.createElement('button');
            reactBtn.className = 'tool-btn';
            reactBtn.innerText = '❤️ تفاعل';
            reactBtn.onclick = () => addReaction(msg.id, '❤️');
            tools.appendChild(reactBtn);

            bubble.appendChild(tools);

            if (msg.reactions) {
                const reactionsDiv = document.createElement('div');
                reactionsDiv.className = 'reactions';
                const counts = {};
                Object.values(msg.reactions).forEach(emoji => {
                    counts[emoji] = (counts[emoji] || 0) + 1;
                });
                for (const [emoji, count] of Object.entries(counts)) {
                    const badge = document.createElement('span');
                    badge.className = 'reaction-badge';
                    badge.innerText = `${emoji} ${count}`;
                    reactionsDiv.appendChild(badge);
                }
                bubble.appendChild(reactionsDiv);
            }

            messageRow.appendChild(bubble);
            messagesContainer.appendChild(messageRow);
        }

        function addReaction(msgId, emoji) {
            db.ref(`messages/${msgId}/reactions/${currentUser.uid}`).set(emoji);
        }

        function pinMessage(text, sender) {
            const encryptedPinnedText = encryptText(text, encryptionKey);
            db.ref('pinned_message').set({
                text: encryptedPinnedText,
                sender: sender
            });
        }

        function listenForPinnedMessage() {
            db.ref('pinned_message').on('value', (snapshot) => {
                const pinned = snapshot.val();
                if (pinned) {
                    const decryptedPinned = decryptText(pinned.text, encryptionKey);
                    pinnedText.innerText = `رسالة مثبتة من [${pinned.sender}]: ${decryptedPinned}`;
                    pinnedBar.style.display = 'flex';
                } else {
                    pinnedBar.style.display = 'none';
                }
            });
        }

        unpinBtn.addEventListener('click', () => {
            db.ref('pinned_message').remove();
        });

        function toggleStar(msgId, buttonElement) {
            if (starredMessages.includes(msgId)) {
                starredMessages = starredMessages.filter(id => id !== msgId);
                buttonElement.innerText = '☆ تمييز';
            } else {
                starredMessages.push(msgId);
                buttonElement.innerText = '⭐ مُميزة';
            }
            localStorage.setItem('starred_messages', JSON.stringify(starredMessages));
        }

        function addEmoji(emoji) {
            messageInput.value += emoji;
            messageInput.focus();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
