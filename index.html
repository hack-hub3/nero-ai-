<script src="https://js.puter.com/v2/"></script>

<script>
const STORAGE_KEY = "nero_v1_secure";
const ENCRYPTION_KEY = "NeroFastMode2026";

let chats = [];
let currentChatId = null;

/* =========================
   ENCRYPTION
========================= */

function encryptData(data){

    try{

        const str = encodeURIComponent(
            JSON.stringify(data)
        );

        let result = "";

        for(let i=0;i<str.length;i++){

            result += String.fromCharCode(
                str.charCodeAt(i) ^
                ENCRYPTION_KEY.charCodeAt(
                    i % ENCRYPTION_KEY.length
                )
            );
        }

        return btoa(result);

    }catch(err){

        return "";
    }
}

function decryptData(data){

    try{

        const decoded = atob(data);

        let result = "";

        for(let i=0;i<decoded.length;i++){

            result += String.fromCharCode(
                decoded.charCodeAt(i) ^
                ENCRYPTION_KEY.charCodeAt(
                    i % ENCRYPTION_KEY.length
                )
            );
        }

        return JSON.parse(
            decodeURIComponent(result)
        );

    }catch(err){

        return [];
    }
}

/* =========================
   STORAGE
========================= */

function saveChats(){

    localStorage.setItem(
        STORAGE_KEY,
        encryptData(chats)
    );

    renderChatList();
}

function loadChats(){

    const data =
        localStorage.getItem(STORAGE_KEY);

    if(!data){

        chats = [];
        return;
    }

    chats = decryptData(data);
}

/* =========================
   UI HELPERS
========================= */

function closePanels(){

    document
    .getElementById("sidebar")
    .classList.remove("open");

    document
    .getElementById("overlay")
    .classList.remove("show");
}

function toggleSidebar(){

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");

    sidebar.classList.toggle("open");
    overlay.classList.toggle("show");
}

/* =========================
   CHAT SYSTEM
========================= */

function createNewChat(secret=false){

    const chat = {

        id: crypto.randomUUID(),

        title: secret
            ? "محادثة مؤقتة ⏱"
            : "محادثة جديدة",

        messages: [],

        secret,

        createdAt: Date.now()
    };

    chats.unshift(chat);

    currentChatId = chat.id;

    saveChats();

    renderMessages();

    closePanels();
}

function getCurrentChat(){

    return chats.find(
        c => c.id === currentChatId
    );
}

function cleanupTemporaryChats(){

    const now = Date.now();

    chats = chats.filter(chat => {

        if(!chat.secret) return true;

        return (
            now - chat.createdAt
            < 15 * 60 * 1000
        );
    });

    saveChats();
}

function loadChat(id){

    currentChatId = id;

    renderMessages();

    renderChatList();

    closePanels();
}

function renderChatList(){

    const list =
        document.getElementById("chatList");

    list.innerHTML = "";

    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className =
            `chat-item ${
                currentChatId === chat.id
                ? "active"
                : ""
            }`;

        item.innerHTML =
            `💬 ${chat.title}`;

        item.onclick = () =>
            loadChat(chat.id);

        list.appendChild(item);
    });
}

function renderMessages(){

    const box =
        document.getElementById("chatBox");

    box.innerHTML = "";

    const chat = getCurrentChat();

    if(!chat) return;

    if(chat.messages.length === 0){

        box.innerHTML = `
        <div style="
            text-align:center;
            margin-top:60px;
            color:var(--text-dim);
        ">
            <div style="font-size:50px;">✨</div>
            <div style="margin-top:12px;">
                كيف يمكنني مساعدتك؟
            </div>
        </div>
        `;

        return;
    }

    chat.messages.forEach(msg => {

        appendMessage(
            msg.role,
            msg.content,
            msg.isImage
        );
    });

    box.scrollTop = box.scrollHeight;
}

function appendMessage(
    role,
    content,
    isImage=false
){

    const box =
        document.getElementById("chatBox");

    const row =
        document.createElement("div");

    row.className =
        `message-row ${role}`;

    const bubble =
        document.createElement("div");

    bubble.className =
        `bubble ${role}`;

    if(isImage){

        bubble.innerHTML = `
        <div class="canvas-container">
            <img src="${content}">
        </div>
        `;

    }else{

        bubble.innerText = content;
    }

    row.appendChild(bubble);

    box.appendChild(row);

    box.scrollTop =
        box.scrollHeight;
}

/* =========================
   SEND MESSAGE
========================= */

function handleEnter(e){

    if(
        e.key === "Enter" &&
        !e.shiftKey
    ){

        e.preventDefault();

        sendMessage();
    }
}

async function sendMessage(){

    const input =
        document.getElementById("userInput");

    const text =
        input.value.trim();

    if(!text) return;

    if(
        !currentChatId ||
        !getCurrentChat()
    ){

        createNewChat();
    }

    const chat = getCurrentChat();

    if(
        chat.messages.length === 0 &&
        !chat.secret
    ){

        chat.title =
            text.substring(0,25);
    }

    chat.messages.push({
        role:"user",
        content:text
    });

    appendMessage(
        "user",
        text
    );

    input.value = "";

    const status =
        document.getElementById(
            "chatStatus"
        );

    status.innerText =
        "Nero V1 يفكر... بطريقة ما.";

    try{

        const history =
            chat.messages
            .filter(m => !m.isImage)
            .map(m => ({

                role:
                    m.role === "user"
                    ? "user"
                    : "assistant",

                content:m.content
            }));

        const response =
            await puter.ai.chat(history);

        const reply =

            response?.message?.content?.[0]?.text ||

            response?.text ||

            String(response);

        chat.messages.push({

            role:"ai",
            content:reply
        });

        appendMessage(
            "ai",
            reply
        );

        saveChats();

        status.innerText = "";

    }catch(err){

        console.error(err);

        status.innerText =
            "فشل الاتصال بالخادم.";
    }
}

/* =========================
   IMAGE GENERATION
========================= */

function drawPicture(){

    const input =
        document.getElementById("userInput");

    const text =
        input.value.trim();

    if(!text){

        document
        .getElementById("chatStatus")
        .innerText =
            "اكتب وصف الصورة أولاً.";

        return;
    }

    if(
        !currentChatId ||
        !getCurrentChat()
    ){

        createNewChat();
    }

    const chat = getCurrentChat();

    appendMessage(
        "user",
        text
    );

    chat.messages.push({
        role:"user",
        content:text
    });

    input.value = "";

    const status =
        document.getElementById(
            "chatStatus"
        );

    status.innerText =
        "جاري رسم الصورة...";

    const seed =
        Math.floor(
            Math.random() * 999999
        );

    const url =
        `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&seed=${seed}`;

    setTimeout(() => {

        appendMessage(
            "ai",
            url,
            true
        );

        chat.messages.push({

            role:"ai",
            content:url,
            isImage:true
        });

        saveChats();

        status.innerText = "";

    },1500);
}

/* =========================
   INIT
========================= */

loadChats();

cleanupTemporaryChats();

if(chats.length){

    currentChatId =
        chats[0].id;

}else{

    createNewChat();
}

renderMessages();

renderChatList();

    </script>
