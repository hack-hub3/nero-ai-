<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nero Group HUB - دردشة جماعية</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #141519;
            --text-main: #f1f3f4;
            --text-muted: #9aa0a6;
            --primary-accent: #3b82f6;
            --success-accent: #10b981;
            --border-color: #2c2d31;
            --whatsapp-user: #128c7e;
            --whatsapp-other: #202c33;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* الشريط العلوي للمجموعة */
        .header-nav {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--panel-color);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            gap: 12px;
        }

        .group-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-accent), var(--success-accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .group-details { flex: 1; }
        .group-title { margin: 0; font-size: 16px; font-weight: 700; }
        .group-meta { font-size: 11px; color: var(--success-accent); margin-top: 2px; }
        
        .action-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }
        .action-icon:hover { color: var(--text-main); }

        /* شاشة منبثقة لإنشاء الحسابات */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .account-box {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .account-box h2 { margin-top: 0; font-size: 20px; color: var(--text-main); }
        
        .avatar-selection {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        
        .avatar-opt {
            font-size: 24px;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .avatar-opt.selected {
            border-color: var(--primary-accent);
            background: rgba(255,255,255,0.05);
        }

        .account-box input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .account-box button {
            background: var(--primary-accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* قائمة الأدوات المنبثقة من زر الخطين يمين الكتابة */
        .tools-menu {
            position: fixed;
            bottom: 75px;
            right: 16px;
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 3000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 180px;
        }

        .tools-menu.show { display: flex; }

        .menu-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            text-align: right;
            cursor: pointer;
            width: 100%;
        }

        .menu-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        
        /* ساحة عرض رسائل المجموعة */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 14px;
            scroll-behavior: smooth;
            background-image: radial-gradient(rgba(255,255,255,0.01) 1px, transparent 0);
            background-size: 20px 20px;
        }
        
        /* فريم فقاعات الرسائل الجماعية */
        .msg-row {
            display: flex;
            flex-direction: column;
            width: fit-content;
            max-width: 75%;
            border-radius: 14px;
            padding: 8px 12px;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        
        .msg-row.self {
            background: var(--whatsapp-user);
            align-self: flex-start;
            border-top-right-radius: 2px;
        }
        
        .msg-row.others {
            background: var(--whatsapp-other);
            align-self: flex-end;
            border-top-left-radius: 2px;
            border: 1px solid #233138;
        }

        .msg-sender {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .self .msg-sender { color: #34d399; }
        .others .msg-sender { color: #60a5fa; }

        .msg-body {
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-line;
        }

        .msg-time {
            font-size: 9px;
            color: var(--text-muted);
            align-self: flex-end;
            margin-top: 4px;
        }

        /* صندوق الإدخال السفلي المطوّر */
        .bottom-bar {
            padding: 10px 12px 20px 12px;
            background: var(--bg-color);
        }
        
        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--panel-color);
            border-radius: 24px;
            padding: 4px 12px;
            gap: 10px;
            border: 1px solid var(--border-color);
        }
        
        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            padding: 10px 0;
        }
        
        .paper-plane-btn {
            color: var(--primary-accent);
            transform: scaleX(-1);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .click-shield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1500; display: none; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="accountModal" style="display: none;">
        <div class="account-box">
            <h2>إنشاء حساب جديد في الجروب 👋</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin: 0;">اختر الرمز التعبيري واسمك للانضمام الفوري للمحادثة الجماعية</p>
            
            <div class="avatar-selection">
                <span class="avatar-opt selected" onclick="pickAvatar(this, '👩‍💻')">👩‍💻</span>
                <span class="avatar-opt" onclick="pickAvatar(this, '👨‍💻')">👨‍💻</span>
                <span class="avatar-opt" onclick="pickAvatar(this, '✨')">✨</span>
                <span class="avatar-opt" onclick="pickAvatar(this, '👑')">👑</span>
            </div>
            
            <input type="text" id="usernameField" placeholder="اكتب اسم المستخدم هنا..." maxlength="12">
            <button onclick="saveNewAccount()">دخول المحادثة الجماعية 🚀</button>
        </div>
    </div>

    <div class="header-nav">
        <div class="group-icon">👥</div>
        <div class="group-details">
            <h1 class="group-title">مجموعة الأصدقاء المشتركة</h1>
            <div class="group-meta" id="groupCounter">الأعضاء النشطين حالياً: 1</div>
        </div>
        <button class="action-icon" onclick="clearGroupHistory()" title="بدء محادثة جديدة كلياً">➕</button>
    </div>

    <div class="click-shield" id="clickShield" onclick="closeToolsMenu()"></div>

    <div class="tools-menu" id="toolsMenu">
        <button class="menu-btn" onclick="triggerMenuAction('👋 أرسل تحية سريعة')">👋 إرسال تحية</button>
        <button class="menu-btn" onclick="triggerMenuAction('👍 موافق!')">👍 إرسال (موافق)</button>
        <button class="menu-btn" onclick="switchAccountAction()">🔄 تبديل أو إضافة حساب</button>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="bottom-bar">
        <div class="input-wrapper">
            <button class="action-icon" style="font-size:18px; color: var(--text-muted);" onclick="toggleToolsMenu(event)">☰</button>
            
            <input type="text" id="messageInputField" placeholder="اكتب رسالتك للمجموعة هنا..." onkeypress="detectEnterKey(event)">
            
            <button class="paper-plane-btn" onclick="dispatchGroupMessage()" title="إرسال">✈</button>
        </div>
    </div>

<script>
    let currentSessionUser = { name: "", avatar: "👩‍💻" };
    let globalMessagesLog = [];

    window.onload = function() {
        initGroupApplication();
    };

    function initGroupApplication() {
        // استعادة الحساب الحالي إن وجد
        const cachedUser = localStorage.getItem('nero_group_current_user');
        if (!cachedUser) {
            document.getElementById('accountModal').style.display = 'flex';
        } else {
            currentSessionUser = JSON.parse(cachedUser);
            syncChatLogFromStorage();
        }
    }

    let selectedAvatarTmp = "👩‍💻";
    function pickAvatar(element, icon) {
        const opts = document.querySelectorAll('.avatar-opt');
        opts.forEach(o => o.classList.remove('selected'));
        element.classList.add('selected');
        selectedAvatarTmp = icon;
    }

    function saveNewAccount() {
        const nameText = document.getElementById('usernameField').value.trim();
        if (!nameText) {
            alert("من فضلك أدخل اسماً صحيحاً لتفعيل الحساب!");
            return;
        }
        currentSessionUser = { name: nameText, avatar: selectedAvatarTmp };
        localStorage.setItem('nero_group_current_user', JSON.stringify(currentSessionUser));
        document.getElementById('accountModal').style.display = 'none';
        
        // إرسال رسالة انضمام تلقائية للجروب
        injectSystemNotification(`${currentSessionUser.avatar} ${currentSessionUser.name} انضم إلى المجموعة الآن.`);
        syncChatLogFromStorage();
    }

    function syncChatLogFromStorage() {
        const logged = localStorage.getItem('nero_group_messages_history');
        if (logged) {
            try { globalMessagesLog = JSON.parse(logged); } catch(e) { globalMessagesLog = []; }
        } else {
            globalMessagesLog = [];
        }
        renderChatAreaUi();
        updateGroupMembersCount();
    }

    function renderChatAreaUi() {
        const area = document.getElementById('chatArea');
        area.innerHTML = '';

        if(globalMessagesLog.length === 0) {
            area.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin:auto; font-size:13px;">المحادثة فارغة تماماً. اكتب أول رسالة لبدء التفاعل الجماعي!</div>`;
            return;
        }

        globalMessagesLog.forEach(msg => {
            const row = document.createElement('div');
            // فرز الاتجاه: إذا كانت الرسالة من الحساب الحالي تظهر بتصميم (self) وإلا تظهر (others)
            const isSelf = msg.senderName === currentSessionUser.name;
            row.className = `msg-row ${isSelf ? 'self' : 'others'}`;

            const senderDiv = document.createElement('div');
            senderDiv.className = 'msg-sender';
            senderDiv.innerText = `${msg.senderAvatar} ${msg.senderName}`;

            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'msg-body';
            bodyDiv.innerText = msg.textBody;

            const timeDiv = document.createElement('div');
            timeDiv.className = 'msg-time';
            timeDiv.innerText = msg.timestamp;

            row.appendChild(senderDiv);
            row.appendChild(bodyDiv);
            row.appendChild(timeDiv);
            area.appendChild(row);
        });

        area.scrollTop = area.scrollHeight;
    }

    function dispatchGroupMessage() {
        const input = document.getElementById('messageInputField');
        const text = input.value.trim();
        if (!text) return; // منع حفظ النصوص الفارغة تماماً بالملي

        const now = new Date();
        const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        const newMsgObj = {
            senderName: currentSessionUser.name,
            senderAvatar: currentSessionUser.avatar,
            textBody: text,
            timestamp: timeString
        };

        globalMessagesLog.push(newMsgObj);
        localStorage.setItem('nero_group_messages_history', JSON.stringify(globalMessagesLog));
        
        input.value = '';
        renderChatAreaUi();
        closeToolsMenu();
    }

    function injectSystemNotification(text) {
        const now = new Date();
        const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        globalMessagesLog.push({
            senderName: "نظام المجموعة",
            senderAvatar: "📢",
            textBody: text,
            timestamp: timeString
        });
        localStorage.setItem('nero_group_messages_history', JSON.stringify(globalMessagesLog));
    }

    function detectEnterKey(e) { if (e.key === 'Enter') dispatchGroupMessage(); }

    function toggleToolsMenu(e) {
        e.stopPropagation();
        const menu = document.getElementById('toolsMenu');
        const shield = document.getElementById('clickShield');
        menu.classList.toggle('show');
        shield.style.display = menu.classList.contains('show') ? 'block' : 'none';
    }

    function closeToolsMenu() {
        document.getElementById('toolsMenu').classList.remove('show');
        document.getElementById('clickShield').style.display = 'none';
    }

    function triggerMenuAction(phrase) {
        document.getElementById('messageInputField').value = phrase;
        dispatchGroupMessage();
    }

    function switchAccountAction() {
        document.getElementById('usernameField').value = '';
        document.getElementById('accountModal').style.display = 'flex';
        closeToolsMenu();
    }

    function clearGroupHistory() {
        if(confirm("هل ترغبين بالتأكيد في تصفير الجروب وبدء جلسة محادثة فارغة وجديدة كلياً؟")) {
            globalMessagesLog = [];
            localStorage.removeItem('nero_group_messages_history');
            renderChatAreaUi();
        }
    }

    function updateGroupMembersCount() {
        // حساب عدد الحسابات الفريدة التي شاركت بالدردشة بشكل تلقائي متميز
        const senders = new Set(globalMessagesLog.map(m => m.senderName));
        senders.add(currentSessionUser.name);
        document.getElementById('groupCounter').innerText = `الأعضاء المشاركين في الجلسة: ${senders.size}`;
    }
</script>
</body>
</html>
