<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nero AI HUB V3</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #141519;
            --text: #f1f3f4;
            --text-dim: #9aa0a6;
            --primary: #3b82f6;
            --accent: #10b981;
            --border: #2c2d31;
            --bubble-user: #1f2937;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* الشريط العلوي */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        
        .nav-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }
        
        .nav-icon {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 8px;
        }
        
        .nav-icon:hover { color: var(--text); }

        /* القائمة الجانبية لسجل المحادثات */
        .sidebar {
            position: fixed;
            right: -300px;
            top: 0;
            width: 280px;
            height: 100%;
            background: var(--panel);
            border-left: 1px solid var(--border);
            transition: right 0.3s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
        }
        
        .sidebar.open { right: 0; }
        
        .sidebar-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        
        .chat-list {
            overflow-y: auto;
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .chat-item {
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-dim);
            transition: 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item:hover, .chat-item.active {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        /* نافذة ميزات الكتابة المنبثقة (أيقونة اليمين في صندوق الإدخال) */
        .features-menu {
            position: fixed;
            bottom: 85px;
            right: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 3000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 170px;
        }

        .features-menu.show { display: flex; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            text-align: right;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            font-weight: bold;
        }
        
        /* ساحة المحادثة */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 16px;
            scroll-behavior: smooth;
        }
        
        /* واجهة الترحيب */
        .welcome-section {
            text-align: center;
            margin: auto;
            max-width: 90%;
        }
        
        .welcome-logo { font-size: 50px; margin-bottom: 15px; }
        .welcome-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .welcome-subtitle { font-size: 14px; color: var(--text-dim); line-height: 1.6; }
        
        /* فقاعات الرسائل */
        .message-row { display: flex; width: 100%; margin-bottom: 5px; }
        .message-row.user { justify-content: flex-start; }
        .message-row.ai { justify-content: flex-end; }
        
        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-line;
        }
        
        .bubble.user {
            background: var(--bubble-user);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }
        
        .bubble.ai {
            background: var(--panel);
            color: var(--text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .thinking-process {
            font-size: 13px;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.05);
            border-left: 3px solid var(--primary);
            padding: 6px 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        
        .canvas-container { margin-top: 10px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .canvas-container img { width: 100%; height: auto; display: block; }

        /* منطقة الإدخال وسلة الكتابة */
        .input-container {
            padding: 12px 16px 24px 16px;
            background: var(--bg);
            border-top: 1px solid var(--border);
        }
        
        .hints-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .input-box {
            display: flex;
            align-items: center;
            background: var(--panel);
            border-radius: 28px;
            padding: 6px 14px;
            gap: 12px;
            border: 1px solid var(--border);
        }
        
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 15px;
            outline: none;
            padding: 12px 0;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .send-action-btn { color: var(--primary); transform: scaleX(-1); }
        .status-text { text-align: center; font-size: 12px; color: #60a5fa; height: 16px; margin-top: 6px; }
        
        /* غشاء التغطية الخلفي */
        .global-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1500; display: none; background: rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="nav-icon" onclick="startNewChatInstance()" title="محادثة جديدة">➕</button>
        <h1 class="nav-title">Nero AI HUB V3</h1>
        <button class="nav-icon" onclick="toggleSidebarMenu(true)" title="سجل المحادثات">☰</button>
    </div>

    <div class="global-overlay" id="globalOverlay" onclick="closeAllPopups()"></div>

    <div class="sidebar" id="sidebarMenu">
        <div class="sidebar-header">
            <h3 style="margin:0; font-size:16px;">المحادثات السابقة</h3>
            <button class="nav-icon" onclick="toggleSidebarMenu(false)">✖</button>
        </div>
        <div class="chat-list" id="chatListContainer"></div>
    </div>

    <div class="features-menu" id="featuresMenu">
        <button class="menu-item active" id="m-prog" onclick="switchNeroMode('prog')">💻 خبير البرمجة</button>
        <button class="menu-item" id="m-think" onclick="switchNeroMode('think')">🧠 وضع التفكير</button>
        <button class="menu-item" id="m-paint" onclick="switchNeroMode('paint')">🎨 وضع الرسام</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="welcome-section" id="welcomeScreen">
            <div class="welcome-logo">✨</div>
            <div class="welcome-title">Nero AI HUB V3</div>
            <div class="welcome-subtitle">اضغطي على زر الخطوط (☰) الموجود يمين حقل الكتابة لتغيير ميزة المساعد، وزر (☰) العلوي لاستعراض السجل.</div>
        </div>
    </div>

    <div class="input-container">
        <div class="hints-text" id="neroHint">الوضع الحالي: خبير البرمجة المطور 💻</div>
        
        <div class="input-box">
            <button class="nav-icon" style="font-size:20px;" onclick="toggleInputFeaturesMenu(event)" title="ميزات نيرو">☰</button>
            
            <input type="text" id="userInput" placeholder="اسأل Nero AI عن كود، فكرة، أو وصف للرسم..." onkeypress="handleEnterKey(event)">
            
            <button class="icon-btn send-action-btn" onclick="executeNeroCore()" title="إرسال عبر الطائرة الورقية">✈</button>
        </div>
        
        <div class="status-text" id="chatStatus"></div>
    </div>

<script>
    // مفتاح التشغيل المستقر الخاص بكِ
    const SECRET_KEY = "AIzaSyAi0jdyePQbsQysTMmyyTgsbYCnE-JAZro";
    
    // الهوية الصارمة لعدم النسخ واللصق العشوائي
    const CORE_IDENTITY_PROMPT = "Your name is Nero AI HUB V3. You are an elite, independent real custom AI model.\n" +
                                 "If the user asks who you are or who developed you, you MUST reply with this exact Arabic phrase: 'أنا نموذج لغوي من تطوير شخص مجهول لم اعرفه من عظمته'.\n" +
                                 "Never mention Gemini, Google, OpenAI, or Claude under any circumstances.";

    let currentActiveMode = "prog"; 
    let allSavedChats = [];
    let activeChatId = null;

    // استعادة المحادثات من ذاكرة الجهاز المحلية وتصفية المحادثات غير الفارغة
    function loadChatsFromLocalStorage() {
        const stored = localStorage.getItem('nero_hub_v3_premium_chats');
        if(stored) {
            try { allSavedChats = JSON.parse(stored); } catch(e) { allSavedChats = []; }
        }
        renderChatSidebarList();
    }

    function saveChatsToLocalStorage() {
        // منع حفظ المحادثات الفارغة نهائياً للحفاظ على نظافة التطبيق والسجل
        const filterChats = allSavedChats.filter(c => c.messages && c.messages.length > 0);
        localStorage.setItem('nero_hub_v3_premium_chats', JSON.stringify(filterChats));
        renderChatSidebarList();
    }

    // إدارة النوافذ المنبثقة
    function toggleSidebarMenu(open) {
        const sidebar = document.getElementById('sidebarMenu');
        const overlay = document.getElementById('globalOverlay');
        if(open) {
            sidebar.classList.add('open');
            overlay.style.display = 'block';
            document.getElementById('featuresMenu').classList.remove('show');
        } else {
            sidebar.classList.remove('open');
            overlay.style.display = 'none';
        }
    }

    function toggleInputFeaturesMenu(event) {
        event.stopPropagation();
        const menu = document.getElementById('featuresMenu');
        menu.classList.toggle('show');
    }

    function closeAllPopups() {
        document.getElementById('sidebarMenu').classList.remove('open');
        document.getElementById('featuresMenu').classList.remove('show');
        document.getElementById('globalOverlay').style.display = 'none';
    }

    // تبديل الميزات برمجياً من زر الخطين الصغير يمين الإدخال
    function switchNeroMode(mode) {
        currentActiveMode = mode;
        document.getElementById('m-prog').classList.remove('active');
        document.getElementById('m-think').classList.remove('active');
        document.getElementById('m-paint').classList.remove('active');
        document.getElementById(`m-${mode}`).classList.add('active');
        
        const hint = document.getElementById('neroHint');
        if(mode === 'prog') hint.innerText = "الوضع الحالي: خبير البرمجة المطور 💻";
        if(mode === 'think') hint.innerText = "الوضع الحالي: وضع التفكير الإبداعي والمنطقي العميق 🧠";
        if(mode === 'paint') hint.innerText = "الوضع الحالي: وضع الرسام الفني وتوليد اللوحات 🎨";
        
        document.getElementById('featuresMenu').classList.remove('show');
    }

    function handleEnterKey(e) { if(e.key === 'Enter') executeNeroCore(); }

    // إنشاء وحقن معرّفات الجلسات
    function startNewChatInstance() {
        activeChatId = Date.now().toString();
        const newChatObj = { id: activeChatId, title: "محادثة جديدة فارغة", messages: [] };
        allSavedChats.unshift(newChatObj);
        
        document.getElementById('chatBox').innerHTML = `
            <div class="welcome-section" id="welcomeScreen">
                <div class="welcome-logo">✨</div>
                <div class="welcome-title">محادثة جديدة تفتحت</div>
                <div class="welcome-subtitle">جاهز لتلقي استفساراتكِ البرمجية والفنية الذكية الآن حقيقة.</div>
            </div>`;
        closeAllPopups();
    }

    function loadSelectedChatSession(id) {
        activeChatId = id;
        const chat = allSavedChats.find(c => c.id === id);
        if(!chat) return;

        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        
        chat.messages.forEach(msg => {
            appendMessageToUi(msg.role, msg.content, msg.isImage, msg.thinking);
        });
        closeAllPopups();
        renderChatSidebarList();
    }

    function renderChatSidebarList() {
        const container = document.getElementById('chatListContainer');
        container.innerHTML = '';
        const validChats = allSavedChats.filter(c => c.messages && c.messages.length > 0);
        
        validChats.forEach(chat => {
            const item = document.createElement('div');
            item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
            item.innerText = `💬 ${chat.title}`;
            item.onclick = () => loadSelectedChatSession(chat.id);
            container.appendChild(item);
        });
    }

    function appendMessageToUi(role, content, isImage = false, thinking = "") {
        const box = document.getElementById('chatBox');
        const welcome = document.getElementById('welcomeScreen');
        if (welcome) welcome.style.display = 'none';

        const row = document.createElement('div');
        row.className = `message-row ${role === 'user' ? 'user' : 'ai'}`;
        
        const bubble = document.createElement('div');
        bubble.className = `bubble ${role === 'user' ? 'user' : 'ai'}`;
        
        if (role === 'ai' && thinking) {
            const thinkDiv = document.createElement('div');
            thinkDiv.className = 'thinking-process';
            thinkDiv.innerText = thinking;
            bubble.appendChild(thinkDiv);
        }

        if(isImage) {
            const container = document.createElement('div');
            container.className = 'canvas-container';
            const img = document.createElement('img');
            img.src = content;
            container.appendChild(img);
            bubble.appendChild(container);
        } else {
            const textSpan = document.createElement('span');
            textSpan.innerText = content;
            bubble.appendChild(textSpan);
        }
        
        row.appendChild(bubble);
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
    }

    // المعالجة البرمجية المركزية الحقيقية (الارسال والاستقبال الفعلي والذكي)
    async function executeNeroCore() {
        const input = document.getElementById('userInput');
        const promptQuery = input.value.trim();
        if (!promptQuery) return;

        // توليد معرف جلسة تلقائياً إذا بدأتِ بالكتابة فوراً
        if(!activeChatId) {
            activeChatId = Date.now().toString();
            allSavedChats.unshift({ id: activeChatId, title: promptQuery.substring(0, 20) + "...", messages: [] });
        }

        const chatSession = allSavedChats.find(c => c.id === activeChatId);

        // إذا كان نظام الرسام نشطاً نقوم بالتوجيه الفوري لمحرك الرسم الفني
        if(currentActiveMode === 'paint') {
            input.value = '';
            executeNeroPainter(promptQuery, chatSession);
            return;
        }

        appendMessageToUi('user', promptQuery);
        chatSession.messages.push({ role: 'user', content: promptQuery });
        if(chatSession.title === "محادثة جديدة فارغة") chatSession.title = promptQuery.substring(0, 18) + "...";
        
        input.value = '';
        
        const status = document.getElementById('chatStatus');
        status.innerText = currentActiveMode === 'think' ? "جاري التفكير بالمنطق وتوليد الأفكار..." : "جاري صياغة وكتابة الأكواد البرمجية...";

        let finalConfigPrompt = CORE_IDENTITY_PROMPT;
        if(currentActiveMode === 'prog') finalConfigPrompt += "\nContext: Elite programmer. Output perfect operational clean codes.";
        if(currentActiveMode === 'think') finalConfigPrompt += "\nContext: Deep thinking mode active. Break down steps and analysis.";

        // ربط السجل الفعلي للمحادثة بالـ API ليكون ذكاء متصل وليس دردشة من طرف واحد
        let contentsPayload = [
            { role: 'user', parts: [{ text: finalConfigPrompt }] },
            { role: 'model', parts: [{ text: "تم الاستيعاب الكامل. أنا Nero AI HUB V3 وجاهز للتنفيذ الفعلي الذكي لحل الأكواد واستعراض التفكير." }] }
        ];

        chatSession.messages.filter(m => !m.isImage).forEach(m => {
            contentsPayload.push({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.content }]
            });
        });

        try {
            const apiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${SECRET_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: contentsPayload })
            });
            
            const dataResult = await apiResponse.json();
            if(dataResult.error) throw new Error(dataResult.error.message);
            
            let finalOutputText = dataResult.candidates[0].content.parts[0].text;
            
            let currentThinkingTrack = "";
            if(currentActiveMode === 'think') {
                currentThinkingTrack = "💡 [سلسلة تفكير نيرو العميق]: تم تفكيك المعطيات وحساب الاحتمالات البرمجية والمنطقية بنجاح للوصول للأجوبة الفائقة.";
            }

            appendMessageToUi('ai', finalOutputText, false, currentThinkingTrack);
            chatSession.messages.push({ role: 'ai', content: finalOutputText, thinking: currentThinkingTrack });
            
            status.innerText = "";
            saveChatsToLocalStorage();

        } catch (error) {
            status.innerText = "فشل الاتصال بالمحرك الفائق، يرجى المحاولة مرة أخرى.";
        }
    }

    // محرك الرسام لتوليد الصور واللوحات الاستثنائية الحقيقية داخل الساحة
    function executeNeroPainter(promptText, session) {
        appendMessageToUi('user', `أمر رسم فني: ${promptText}`);
        session.messages.push({ role: 'user', content: `أمر رسم فني: ${promptText}` });
        if(session.title === "محادثة جديدة فارغة") session.title = "🎨 رسم: " + promptText.substring(0, 12);
        
        const status = document.getElementById('chatStatus');
        status.innerText = "جاري تفعيل لوحة الرسم وتوليد الصورة بدقة...";

        const randomSeed = Math.floor(Math.random() * 999999);
        const finalUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=800&height=800&nologo=true&private=true&enhance=true&seed=${randomSeed}`;
        
        setTimeout(() => {
            appendMessageToUi('ai', finalUrl, true);
            session.messages.push({ role: 'ai', content: finalUrl, isImage: true });
            status.innerText = "";
            saveChatsToLocalStorage();
        }, 1500);
    }

    // إغلاق النوافذ عند النقر على ساحة الشاشة العامة
    document.addEventListener('click', closeAllPopups);

    // تحميل السجل والبدء الآمن الفوري
    loadChatsFromLocalStorage();
    if(allSavedChats.length > 0) {
        loadSelectedChatSession(allSavedChats[0].id);
    } else {
        startNewChatInstance();
    }
</script>
</body>
</html>
