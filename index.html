<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nero AI HUB X</title>

<style>
:root{
    --bg:#0b0c10;
    --panel:#141519;
    --text:#f1f3f4;
    --muted:#9aa0a6;
    --primary:#3b82f6;
    --accent:#10b981;
    --border:#2c2d31;
    --user:#1f2937;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:100;
}

.topbar h1{
    font-size:18px;
}

.icon-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:20px;
    transition:.2s;
}

.icon-btn:hover{
    color:white;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    top:0;
    right:-320px;
    width:300px;
    height:100%;
    background:var(--panel);
    border-left:1px solid var(--border);
    transition:.3s;
    z-index:999;
    display:flex;
    flex-direction:column;
}

.sidebar.open{
    right:0;
}

.sidebar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
    border-bottom:1px solid var(--border);
}

.chat-list{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.chat-item{
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:8px;
    transition:.2s;
    color:var(--muted);
    background:transparent;
}

.chat-item:hover,
.chat-item.active{
    background:rgba(59,130,246,.12);
    color:#60a5fa;
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:998;
    display:none;
}

.overlay.show{
    display:block;
}

/* CHAT */

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
}

.welcome{
    margin:auto;
    text-align:center;
}

.welcome .logo{
    font-size:55px;
    margin-bottom:14px;
}

.welcome h2{
    font-size:28px;
    margin-bottom:10px;
    background:linear-gradient(to left,#60a5fa,#34d399);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.welcome p{
    color:var(--muted);
    line-height:1.7;
}

/* MESSAGE */

.row{
    display:flex;
}

.row.user{
    justify-content:flex-start;
}

.row.ai{
    justify-content:flex-end;
}

.bubble{
    max-width:85%;
    padding:14px;
    border-radius:18px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
}

.bubble.user{
    background:var(--user);
    border-bottom-right-radius:5px;
}

.bubble.ai{
    background:var(--panel);
    border:1px solid var(--border);
    border-bottom-left-radius:5px;
}

/* THINKING */

.thinking{
    margin-bottom:10px;
    padding:8px 10px;
    border-right:3px solid var(--primary);
    background:rgba(59,130,246,.08);
    color:#60a5fa;
    border-radius:8px;
    font-size:13px;
}

/* IMAGE */

.canvas{
    overflow:hidden;
    border-radius:14px;
    border:1px solid var(--border);
}

.canvas img{
    width:100%;
    display:block;
}

/* INPUT */

.input-area{
    padding:14px;
    border-top:1px solid var(--border);
    background:var(--bg);
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:24px;
    padding:10px 14px;
}

textarea{
    flex:1;
    background:none;
    border:none;
    resize:none;
    outline:none;
    color:white;
    max-height:140px;
    min-height:24px;
    font-size:15px;
    font-family:inherit;
}

.status{
    text-align:center;
    color:#60a5fa;
    font-size:12px;
    margin-top:8px;
    height:16px;
}

/* MENU */

.mode-menu{
    position:fixed;
    bottom:90px;
    right:16px;
    width:180px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px;
    display:none;
    flex-direction:column;
    z-index:1000;
}

.mode-menu.show{
    display:flex;
}

.mode-item{
    border:none;
    background:none;
    color:var(--muted);
    text-align:right;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.mode-item:hover,
.mode-item.active{
    background:rgba(59,130,246,.12);
    color:#60a5fa;
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:20px;
}

@media(max-width:600px){

    .bubble{
        max-width:95%;
    }

    .sidebar{
        width:85%;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <button class="icon-btn" id="newChatBtn">➕</button>
    <h1>Nero AI HUB X</h1>
    <button class="icon-btn" id="openSidebarBtn">☰</button>
</div>

<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
        <h3>المحادثات</h3>
        <button class="icon-btn" id="closeSidebarBtn">✖</button>
    </div>

    <div class="chat-list" id="chatList"></div>

</aside>

<!-- MODE MENU -->

<div class="mode-menu" id="modeMenu">

    <button class="mode-item active" data-mode="prog">
        💻 خبير البرمجة
    </button>

    <button class="mode-item" data-mode="think">
        🧠 التفكير العميق
    </button>

    <button class="mode-item" data-mode="paint">
        🎨 الرسام
    </button>

</div>

<!-- CHAT -->

<div class="chat-box" id="chatBox">

    <div class="welcome" id="welcome">

        <div class="logo">✨</div>

        <h2>Nero AI HUB X</h2>

        <p>
            نسخة محسنة وأكثر استقرارًا. لأن المتصفحات أصلًا عندها مشاكل نفسية كفاية.
        </p>

    </div>

</div>

<!-- INPUT -->

<div class="input-area">

    <div class="input-box">

        <button class="icon-btn" id="modeBtn">☰</button>

        <textarea
            id="promptInput"
            rows="1"
            placeholder="اكتب شيئًا..."
        ></textarea>

        <button class="icon-btn" id="sendBtn">✈</button>

    </div>

    <div class="status" id="status"></div>

</div>

<script>

const STORAGE_KEY = "nero_ai_hub_x";

const state = {
    mode: "prog",
    chats: [],
    activeChatId: null
};

/* ELEMENTS */

const chatBox = document.getElementById("chatBox");
const promptInput = document.getElementById("promptInput");
const statusText = document.getElementById("status");
const overlay = document.getElementById("overlay");
const sidebar = document.getElementById("sidebar");
const modeMenu = document.getElementById("modeMenu");
const chatList = document.getElementById("chatList");

/* STORAGE */

function saveChats(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state.chats)
    );
}

function loadChats(){

    try{
        const data = JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        );

        if(Array.isArray(data)){
            state.chats = data;
        }

    }catch(err){
        console.error(err);
        state.chats = [];
    }
}

/* CHAT MANAGEMENT */

function createChat(title="محادثة جديدة"){

    const chat = {
        id: crypto.randomUUID(),
        title,
        messages:[]
    };

    state.chats.unshift(chat);
    state.activeChatId = chat.id;

    saveChats();
    renderChats();

    clearChatUI();

    return chat;
}

function getActiveChat(){
    return state.chats.find(
        c => c.id === state.activeChatId
    );
}

function renderChats(){

    chatList.innerHTML = "";

    state.chats.forEach(chat => {

        const item = document.createElement("div");

        item.className =
            "chat-item " +
            (chat.id === state.activeChatId ? "active":"");

        item.textContent = "💬 " + chat.title;

        item.onclick = () => {
            state.activeChatId = chat.id;
            renderMessages(chat);
            renderChats();
            closeMenus();
        };

        chatList.appendChild(item);
    });
}

function renderMessages(chat){

    clearChatUI();

    chat.messages.forEach(msg => {
        appendMessage(msg);
    });
}

function clearChatUI(){

    chatBox.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="logo">✨</div>
            <h2>Nero AI HUB X</h2>
        </div>
    `;
}

/* UI */

function appendMessage(msg){

    const welcome =
        document.getElementById("welcome");

    if(welcome) welcome.remove();

    const row = document.createElement("div");
    row.className = `row ${msg.role}`;

    const bubble = document.createElement("div");
    bubble.className = `bubble ${msg.role}`;

    if(msg.thinking){

        const thinking = document.createElement("div");

        thinking.className = "thinking";
        thinking.textContent = msg.thinking;

        bubble.appendChild(thinking);
    }

    if(msg.isImage){

        const container =
            document.createElement("div");

        container.className = "canvas";

        const img = document.createElement("img");
        img.src = msg.content;

        container.appendChild(img);
        bubble.appendChild(container);

    }else{

        bubble.innerHTML = formatText(msg.content);
    }

    row.appendChild(bubble);

    chatBox.appendChild(row);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}

/* SIMPLE MARKDOWN */

function formatText(text){

    return text
        .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
        .replace(/\n/g,"<br>");
}

/* MENUS */

function openSidebar(){
    sidebar.classList.add("open");
    overlay.classList.add("show");
}

function closeMenus(){
    sidebar.classList.remove("open");
    modeMenu.classList.remove("show");
    overlay.classList.remove("show");
}

/* AI ENGINE */

async function sendMessage(){

    const text = promptInput.value.trim();

    if(!text) return;

    let chat = getActiveChat();

    if(!chat){
        chat = createChat(
            text.substring(0,20)
        );
    }

    const userMsg = {
        role:"user",
        content:text
    };

    chat.messages.push(userMsg);

    appendMessage(userMsg);

    promptInput.value = "";
    autoResize();

    statusText.textContent =
        "جاري التفكير... لأن البشر يحبون تعقيد كل شيء.";

    if(state.mode === "paint"){

        generateImage(text,chat);
        return;
    }

    setTimeout(() => {

        let reply = "";
        let thinking = "";

        switch(state.mode){

            case "think":

                thinking =
                    "تم تحليل السؤال عبر وضع التفكير العميق.";

                reply =
                    `تحليل ذكي للسؤال:\n\n${text}\n\nتمت المعالجة بنجاح.`;

                break;

            default:

                reply =
                    `تم استلام طلبك:\n\n"${text}"\n\nوالنظام يعمل بشكل مستقر أخيرًا. معجزة تقنية صغيرة.`;
        }

        const aiMsg = {
            role:"ai",
            content:reply,
            thinking
        };

        chat.messages.push(aiMsg);

        appendMessage(aiMsg);

        saveChats();

        statusText.textContent = "";

    },1000);
}

/* IMAGE MODE */

function generateImage(prompt,chat){

    statusText.textContent =
        "جاري توليد الصورة...";

    const seed =
        Math.floor(Math.random()*999999);

    const url =
        `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}`;

    setTimeout(()=>{

        const msg = {
            role:"ai",
            content:url,
            isImage:true
        };

        chat.messages.push(msg);

        appendMessage(msg);

        saveChats();

        statusText.textContent = "";

    },1500);
}

/* AUTO RESIZE */

function autoResize(){

    promptInput.style.height = "auto";

    promptInput.style.height =
        promptInput.scrollHeight + "px";
}

/* EVENTS */

document
.getElementById("sendBtn")
.addEventListener("click",sendMessage);

promptInput.addEventListener("input",autoResize);

promptInput.addEventListener("keydown",e=>{

    if(e.key==="Enter" && !e.shiftKey){

        e.preventDefault();
        sendMessage();
    }
});

document
.getElementById("newChatBtn")
.addEventListener("click",()=>{

    createChat();
});

document
.getElementById("openSidebarBtn")
.addEventListener("click",openSidebar);

document
.getElementById("closeSidebarBtn")
.addEventListener("click",closeMenus);

overlay.addEventListener("click",closeMenus);

document
.getElementById("modeBtn")
.addEventListener("click",(e)=>{

    e.stopPropagation();

    modeMenu.classList.toggle("show");
    overlay.classList.add("show");
});

document.querySelectorAll(".mode-item")
.forEach(btn=>{

    btn.addEventListener("click",()=>{

        document
        .querySelectorAll(".mode-item")
        .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        state.mode = btn.dataset.mode;

        closeMenus();
    });
});

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){
        closeMenus();
    }
});

/* INIT */

loadChats();

if(state.chats.length){

    state.activeChatId =
        state.chats[0].id;

    renderMessages(state.chats[0]);

}else{

    createChat();
}

renderChats();

</script>

</body>
    </html>
