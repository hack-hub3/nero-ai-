<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nero AI V1</title>

<script src="https://js.puter.com/v2/"></script>

<style>

:root{
    --bg:#131314;
    --surface:#1e1f20;
    --text:#e3e3e3;
    --text-dim:#a1a1aa;
    --primary:#60a5fa;
    --border:#3f3f46;
    --user:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,sans-serif;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* TOPBAR */

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    background:var(--bg);
    border-bottom:1px solid rgba(255,255,255,.04);
    z-index:100;
}

.top-title{
    font-size:17px;
    font-weight:700;
    color:white;
}

.icon-btn{
    width:42px;
    height:42px;
    border:none;
    background:none;
    color:var(--text);
    border-radius:50%;
    cursor:pointer;
    transition:.2s;
    font-size:20px;
}

.icon-btn:hover{
    background:rgba(255,255,255,.06);
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    top:0;
    right:-320px;
    width:300px;
    height:100%;
    background:var(--surface);
    transition:.3s;
    z-index:1000;
    display:flex;
    flex-direction:column;
    box-shadow:-5px 0 20px rgba(0,0,0,.5);
}

.sidebar.open{
    right:0;
}

.sidebar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
}

.chat-list{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.chat-item{
    padding:14px;
    border-radius:16px;
    cursor:pointer;
    margin-bottom:6px;
    transition:.2s;
    color:var(--text-dim);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.chat-item:hover{
    background:rgba(255,255,255,.05);
}

.chat-item.active{
    background:rgba(96,165,250,.15);
    color:var(--primary);
}

/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}

/* CHAT */

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    gap:20px;
    scroll-behavior:smooth;
}

.welcome{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
}

.welcome .logo{
    font-size:56px;
    margin-bottom:10px;
}

.message-row{
    display:flex;
    width:100%;
}

.message-row.user{
    justify-content:flex-start;
}

.message-row.ai{
    justify-content:flex-end;
}

.bubble{
    max-width:85%;
    padding:14px 16px;
    border-radius:22px;
    line-height:1.7;
    font-size:15px;
    white-space:pre-wrap;
    word-break:break-word;
}

.bubble.user{
    background:var(--user);
    border-bottom-right-radius:6px;
}

.bubble.ai{
    background:var(--surface);
    border:1px solid rgba(255,255,255,.05);
    border-bottom-left-radius:6px;
}

/* IMAGE */

.canvas-container{
    overflow:hidden;
    border-radius:16px;
}

.canvas-container img{
    width:100%;
    display:block;
}

/* INPUT */

.input-container{
    padding:14px;
    background:var(--bg);
    border-top:1px solid rgba(255,255,255,.05);
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:28px;
    padding:10px 14px;
}

textarea{
    flex:1;
    background:none;
    border:none;
    resize:none;
    outline:none;
    color:white;
    font-size:15px;
    font-family:inherit;
    max-height:140px;
    min-height:24px;
}

.send-btn{
    color:var(--primary);
}

.status{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:8px;
    height:16px;
}

.temp-btn{
    margin:0 10px 10px;
    padding:12px;
    border:none;
    border-radius:14px;
    background:rgba(250,204,21,.08);
    color:#facc15;
    cursor:pointer;
    transition:.2s;
}

.temp-btn:hover{
    background:rgba(250,204,21,.15);
}

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:20px;
}

@media(max-width:600px){

    .sidebar{
        width:85%;
    }

    .bubble{
        max-width:95%;
    }
}

</style>
</head>

<body>

<!-- TOP -->

<div class="top-bar">

    <button class="icon-btn" onclick="toggleSidebar()">
        ☰
    </button>

    <div class="top-title">
        Nero AI V1 ⚡
    </div>

    <button class="icon-btn" onclick="createNewChat()">
        ✚
    </button>

</div>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <h3>المحادثات</h3>

        <button class="icon-btn" onclick="toggleSidebar()">
            ✕
        </button>

    </div>

    <button class="temp-btn" onclick="createNewChat(true)">
        ⏱ محادثة مؤقتة 15 دقيقة
    </button>

    <div class="chat-list" id="chatList"></div>

</div>

<!-- OVERLAY -->

<div
    class="overlay"
    id="overlay"
    onclick="closePanels()"
></div>

<!-- CHAT -->

<div class="chat-box" id="chatBox">

    <div class="welcome">

        <div class="logo">✨</div>

        <div>
            جاهز للأسئلة والكود والصور.<br>
            المتصفح غالبًا سيتحمل... نظريًا.
        </div>

    </div>

</div>

<!-- INPUT -->

<div class="input-container">

    <div class="input-box">

        <button
            class="icon-btn"
            onclick="drawPicture()"
        >
            🎨
        </button>

        <textarea
            id="userInput"
            rows="1"
            placeholder="اكتب رسالة..."
            oninput="autoResize(this)"
            onkeydown="handleEnter(event)"
        ></textarea>

        <button
            class="icon-btn send-btn"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

    <div class="status" id="chatStatus"></div>

</div>

<script>

/* =========================
   STORAGE + SECURITY
========================= */

const STORAGE_KEY = "nero_v1_secure_storage";

const SECRET_KEY = "NeroEncryption2026";

function encryptData(data){

    try{

        const json =
            encodeURIComponent(
                JSON.stringify(data)
            );

        let result = "";

        for(let i=0;i<json.length;i++){

            result += String.fromCharCode(

                json.charCodeAt(i)

                ^

                SECRET_KEY.charCodeAt(
                    i % SECRET_KEY.length
                )
            );
        }

        return btoa(result);

    }catch(err){

        return "";
    }
}

function decryptData(data){

    try{

        const decoded = atob(data);

        let result = "";

        for(let i=0;i<decoded.length;i++){

            result += String.fromCharCode(

                decoded.charCodeAt(i)

                ^

                SECRET_KEY.charCodeAt(
                    i % SECRET_KEY.length
                )
            );
        }

        return JSON.parse(
            decodeURIComponent(result)
        );

    }catch(err){

        return [];
    }
}

/* =========================
   APP STATE
========================= */

let chats = [];

let currentChatId = null;

/* =========================
   STORAGE
========================= */

function saveChats(){

    localStorage.setItem(

        STORAGE_KEY,

        encryptData(chats)
    );

    renderChatList();
}

function loadChats(){

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(!saved){

        chats = [];
        return;
    }

    chats = decryptData(saved);
}

/* =========================
   PANELS
========================= */

function toggleSidebar(){

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");

    sidebar.classList.toggle("open");

    overlay.classList.toggle("show");
}

function closePanels(){

    document
    .getElementById("sidebar")
    .classList.remove("open");

    document
    .getElementById("overlay")
    .classList.remove("show");
}

/* =========================
   CHAT SYSTEM
========================= */

function createNewChat(secret=false){

    const chat = {

        id: crypto.randomUUID(),

        title: secret
            ? "محادثة مؤقتة ⏱"
            : "محادثة جديدة",

        messages: [],

        secret,

        createdAt: Date.now()
    };

    chats.unshift(chat);

    currentChatId = chat.id;

    saveChats();

    renderMessages();

    closePanels();
}

function getCurrentChat(){

    return chats.find(
        c => c.id === currentChatId
    );
}

function cleanupTemporaryChats(){

    const now = Date.now();

    chats = chats.filter(chat => {

        if(!chat.secret)
            return true;

        return (

            now - chat.createdAt

            <

            15 * 60 * 1000
        );
    });

    saveChats();
}

function loadChat(id){

    currentChatId = id;

    renderMessages();

    renderChatList();

    closePanels();
}

function renderChatList(){

    const list =
        document.getElementById("chatList");

    list.innerHTML = "";

    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className =
            `chat-item ${
                currentChatId === chat.id
                ? "active"
                : ""
            }`;

        item.textContent =
            "💬 " + chat.title;

        item.onclick = () =>
            loadChat(chat.id);

        list.appendChild(item);
    });
}

/* =========================
   MESSAGES
========================= */

function renderMessages(){

    const box =
        document.getElementById("chatBox");

    box.innerHTML = "";

    const chat = getCurrentChat();

    if(!chat) return;

    if(chat.messages.length === 0){

        box.innerHTML = `
        <div class="welcome">
            <div class="logo">✨</div>
            <div>
                كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
        `;

        return;
    }

    chat.messages.forEach(msg => {

        appendMessage(
            msg.role,
            msg.content,
            msg.isImage
        );
    });

    box.scrollTop =
        box.scrollHeight;
}

function appendMessage(

    role,
    content,
    isImage=false

){

    const box =
        document.getElementById("chatBox");

    const row =
        document.createElement("div");

    row.className =
        `message-row ${role}`;

    const bubble =
        document.createElement("div");

    bubble.className =
        `bubble ${role}`;

    if(isImage){

        bubble.innerHTML = `
        <div class="canvas-container">
            <img src="${content}">
        </div>
        `;

    }else{

        bubble.innerText = content;
    }

    row.appendChild(bubble);

    box.appendChild(row);

    box.scrollTop =
        box.scrollHeight;
}

/* =========================
   INPUT
========================= */

function autoResize(el){

    el.style.height = "auto";

    el.style.height =
        el.scrollHeight + "px";
}

function handleEnter(e){

    if(
        e.key === "Enter"
        &&
        !e.shiftKey
    ){

        e.preventDefault();

        sendMessage();
    }
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "userInput"
        );

    const text =
        input.value.trim();

    if(!text) return;

    if(
        !currentChatId
        ||
        !getCurrentChat()
    ){

        createNewChat();
    }

    const chat = getCurrentChat();

    if(
        chat.messages.length === 0
        &&
        !chat.secret
    ){

        chat.title =
            text.substring(0,25);
    }

    chat.messages.push({

        role:"user",

        content:text
    });

    appendMessage(
        "user",
        text
    );

    input.value = "";

    autoResize(input);

    const status =
        document.getElementById(
            "chatStatus"
        );

    status.innerText =
        "Nero يفكر... بطريقة مريبة.";

    try{

        const history =

            chat.messages

            .filter(m => !m.isImage)

            .map(m => ({

                role:
                    m.role === "user"
                    ? "user"
                    : "assistant",

                content:m.content
            }));

        const response =
            await puter.ai.chat(history);

        const reply =

            response?.message?.content?.[0]?.text

            ||

            response?.text

            ||

            String(response);

        chat.messages.push({

            role:"ai",

            content:reply
        });

        appendMessage(
            "ai",
            reply
        );

        saveChats();

        status.innerText = "";

    }catch(err){

        console.error(err);

        status.innerText =
            "فشل الاتصال بالسيرفر.";
    }
}

/* =========================
   IMAGE GENERATION
========================= */

function drawPicture(){

    const input =
        document.getElementById(
            "userInput"
        );

    const text =
        input.value.trim();

    if(!text){

        document
        .getElementById("chatStatus")
        .innerText =
            "اكتب وصف الصورة أولاً.";

        return;
    }

    if(
        !currentChatId
        ||
        !getCurrentChat()
    ){

        createNewChat();
    }

    const chat = getCurrentChat();

    appendMessage(
        "user",
        text
    );

    chat.messages.push({

        role:"user",

        content:text
    });

    input.value = "";

    autoResize(input);

    const status =
        document.getElementById(
            "chatStatus"
        );

    status.innerText =
        "جاري رسم الصورة...";

    const seed =
        Math.floor(
            Math.random() * 999999
        );

    const imageUrl =

        `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&seed=${seed}`;

    setTimeout(() => {

        appendMessage(
            "ai",
            imageUrl,
            true
        );

        chat.messages.push({

            role:"ai",

            content:imageUrl,

            isImage:true
        });

        saveChats();

        status.innerText = "";

    },1500);
}

/* =========================
   INIT
========================= */

loadChats();

cleanupTemporaryChats();

if(chats.length){

    currentChatId =
        chats[0].id;

}else{

    createNewChat();
}

renderMessages();

renderChatList();

</script>

</body>
       </html>
